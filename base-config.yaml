# Set allowlist to `false` to allow anyone; otherwise add entries such as "@user:example.com"
allowlist: []
default_backend: "local"
backends:
  local:
    type: basic_openai
    base_url: "http://localhost:1234"
    # If you use a separate local OpenAI-compatible backend for images
    #   (such as Stable Diffusion) then enter that URL here
    img_url: null
    # Ignore unless your local backend requires an API key
    api_key: YOUR_KEY_HERE
    default_model: null
    default_system_prompt: "You are a helpful digital assistant."
  openai:
    type: openai
    api_key: YOUR_KEY_HERE
    default_model: gpt-4-turbo
  anthropic:
    type: anthropic
    api_key: YOUR_KEY_HERE
    max_tokens: 1024
    default_model: claude-3-opus-20240229
customization:
  # Set this string to use a custom "!<trigger>" for the bot
  #   Default: "!llm"
  custom_trigger: null
  # Default emoji: ✅
  wait_reaction: ""
  # Default emoji: ⏳
  done_reaction: ""